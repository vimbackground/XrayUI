name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    name: resolve version
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -match '^v?\d+(\.\d+){1,3}$') {
            $ver = $tag -replace '^v',''
          } else {
            $csproj = [xml](Get-Content -Path "XrayUI-dev.csproj" -Raw)
            $ver = $csproj.Project.PropertyGroup.Version
            if (-not $ver -or $ver -like '*-dev') {
              $ver = '1.1.0'
            }
          }
          "version=$ver" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $ver"

  publish:
    name: publish ${{ matrix.rid }}${{ matrix.wasdk_sc && '-wasdk' || '' }} (AOT)
    needs: init
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
        # false = framework-dependent WinAppSDK (needs Windows App Runtime installed,
        # smaller zip; the auto-update channel tracks these). true = runtime bundled
        # into the app folder ("-wasdk" zips, no installer needed, much larger).
        wasdk_sc: [false, true]
        include:
          - rid: win-x64
            platform: x64
            rust_target: x86_64-pc-windows-msvc
          - rid: win-arm64
            platform: ARM64
            rust_target: aarch64-pc-windows-msvc

    env:
      # Suffix for zip/artifact names: "" or "-wasdk".
      VARIANT: ${{ matrix.wasdk_sc && '-wasdk' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # No separate `dotnet restore` step: PublishAot must be set at restore time
      # for ILCompiler to be pulled in.
      - name: Publish (${{ matrix.rid }}${{ env.VARIANT }}, AOT)
        run: >
          dotnet publish XrayUI-dev.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:SelfContained=true
          -p:PublishAot=true
          -p:PublishTrimmed=true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=false
          -p:WindowsAppSDKSelfContained=${{ matrix.wasdk_sc }}
          -p:CopyOutputSymbolsToPublishDirectory=false
          -p:Version=${{ needs.init.outputs.version }}
          -p:BuildingForCI=true

      - name: Install Rust (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build Updater (${{ matrix.rust_target }})
        run: >
          cargo build --release
          --manifest-path updater-rs/Cargo.toml
          --bin xrayui-updater
          --target ${{ matrix.rust_target }}

      - name: Bundle updater into staging
        shell: pwsh
        run: |
          $publishDir = "bin/Release/net10.0-windows10.0.19041.0/${{ matrix.rid }}/publish"
          $updaterExe = "updater-rs/target/${{ matrix.rust_target }}/release/xrayui-updater.exe"
          if (-not (Test-Path $updaterExe)) {
            Write-Host "::error::Updater build did not produce $updaterExe"
            exit 1
          }
          Copy-Item $updaterExe -Destination "$publishDir/XrayUI.Updater.exe" -Force
          Write-Host "Bundled XrayUI.Updater.exe (Rust) into $publishDir"

      - name: Verify AOT exe produced
        shell: pwsh
        run: |
          $publishDir = "bin/Release/net10.0-windows10.0.19041.0/${{ matrix.rid }}/publish"
          $exe = "$publishDir/XrayUI-Portable.exe"
          Write-Host "Listing $publishDir :"
          if (Test-Path $publishDir) {
            Get-ChildItem -Recurse $publishDir | ForEach-Object { $_.FullName }
          } else {
            Write-Host "(publish dir does not exist)"
          }
          if (-not (Test-Path $exe)) {
            Write-Host "::error::Publish did not produce $exe"
            exit 1
          }
          Write-Host "OK: AOT exe found at $exe ($((Get-Item $exe).Length) bytes)"

      - name: Pack zip
        shell: pwsh
        run: |
          $publishDir = "bin/Release/net10.0-windows10.0.19041.0/${{ matrix.rid }}/publish"
          $zipName = "XrayUI-${{ matrix.rid }}${{ env.VARIANT }}.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipName -CompressionLevel Optimal
          Write-Host "Created $zipName ($((Get-Item $zipName).Length) bytes)"

      - name: Generate SHA256
        shell: pwsh
        run: |
          $zip = "XrayUI-${{ matrix.rid }}${{ env.VARIANT }}.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$zip.sha256", "$hash  $zip", [System.Text.Encoding]::ASCII)
          Write-Host "Wrote $zip.sha256 = $hash"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: XrayUI-${{ matrix.rid }}${{ env.VARIANT }}
          path: XrayUI-${{ matrix.rid }}${{ env.VARIANT }}.zip*
          retention-days: 14
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: [init, publish]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-files" | Out-Null
          Get-ChildItem -Path "artifacts" -Recurse -Include "*.zip", "*.sha256" | ForEach-Object {
            Move-Item -Path $_.FullName -Destination "release-files" -Force
          }
          Get-ChildItem -Path "release-files" | ForEach-Object { Write-Host $_.Name }

      - name: Extract Changelog & Generate Release Body
        shell: pwsh
        run: |
          $ver = "${{ needs.init.outputs.version }}"
          $notes = ""
          if (Test-Path "CHANGELOG.md") {
            $content = Get-Content "CHANGELOG.md" -Raw
            $pattern = "(?ms)##\s*\[?v?$([regex]::Escape($ver))\]?.*?(?=(?:\r?\n##\s|\Z))"
            if ($content -match $pattern) {
              $notes = $matches[0].Trim()
            }
          }
          if (-not $notes) {
            $notes = "## XrayUI-Portable v$ver`n`n欢迎使用 XrayUI-Portable 绿色便携版客户端。"
          }

          $body = @"
## 📥 下载指南 / Download Guide

#### 🌟 推荐常规版 / Normal version (Recommended)
- **x64 (绝大多数 Windows 电脑)**: [XrayUI-win-x64.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/v$ver/XrayUI-win-x64.zip)
- **ARM64 (骁龙/Surface Pro X 等)**: [XrayUI-win-arm64.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/v$ver/XrayUI-win-arm64.zip)

#### 📦 包含 WinAppSDK 运行时独立版（仅在常规版提示缺少组件无法启动时使用）
- [x64 独立版](${{ github.server_url }}/${{ github.repository }}/releases/download/v$ver/XrayUI-win-x64-wasdk.zip)
- [ARM64 独立版](${{ github.server_url }}/${{ github.repository }}/releases/download/v$ver/XrayUI-win-arm64-wasdk.zip)

---

$notes
"@
          [System.IO.File]::WriteAllText("release-body.md", $body, [System.Text.Encoding]::UTF8)
          Write-Host "Generated release body for v$ver"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.init.outputs.version }}
          name: XrayUI-Portable v${{ needs.init.outputs.version }}
          body_path: release-body.md
          files: |
            release-files/*.zip
            release-files/*.sha256
          make_latest: true
